<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Debug Layout</title>
    <link rel="stylesheet" href="debug_layout.css">
</head>
<body>

<h1>Layout bị vỡ</h1>

<div class="container broken">
    <div class="sidebar">
        Sidebar
    </div>

    <div class="content">
        Content
    </div>
</div>

<hr>

<h1>Cách sửa 1 — Dùng border-box</h1>

<div class="container fixed-box">
    <div class="sidebar">
        Sidebar
    </div>

    <div class="content">
        Content
    </div>
</div>

<hr>

<h1>Cách sửa 2 — Không dùng border-box</h1>

<div class="container fixed-width">
    <div class="sidebar">
        Sidebar
    </div>

    <div class="content">
        Content
    </div>
</div>

</body>
</html>
