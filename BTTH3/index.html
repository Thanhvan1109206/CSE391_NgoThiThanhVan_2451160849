<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Sinh Viên - K66 BTTH03</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>HỆ THỐNG QUẢN LÝ SINH VIÊN</h1>

        <div class="statistics-bar">
            <div>Tổng số sinh viên: <span id="total-students">0</span></div>
            <div>Điểm trung bình lớp: <span id="class-average">0.0</span></div>
        </div>

        <div class="action-bar">
            <button id="btn-open-modal">+ Thêm Sinh Viên Mới</button>
        </div>

        <table border="1" style="width:100%; margin-top:20px; border-collapse:collapse;">
            <thead>
                <tr>
                    <th>Mã SV</th><th>Họ và Tên</th><th>Ngày Sinh</th><th>Lớp</th><th>Điểm TB</th><th>Email</th><th>Hành động</th>
                </tr>
            </thead>
            <tbody id="student-table-body">
                <!-- Dữ liệu động sẽ nạp vào đây -->
            </tbody>
        </table>
    </div>

    <!-- Popup Modal Form -->
    <div id="student-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h3 id="modal-title">Thêm Sinh Viên Mới</h3>
            <form id="student-form">
                <input type="hidden" id="form-mode" value="create">
                <input type="hidden" id="old-student-id">
                <div><label>Mã SV:</label><input type="text" id="student-id" required></div>
                <div><label>Họ tên:</label><input type="text" id="student-name" required></div>
                <div><label>Ngày sinh:</label><input type="date" id="student-dob" required></div>
                <div><label>Lớp:</label><input type="text" id="student-class" required></div>
                <div><label>Điểm TB:</label><input type="number" id="student-gpa" step="0.1" min="0" max="10" required></div>
                <div><label>Email:</label><input type="email" id="student-email" required></div>
                <div style="margin-top:15px;">
                    <button type="button" id="btn-close-modal">Hủy</button>
                    <button type="submit">Lưu dữ liệu</button>
                </div>
            </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
