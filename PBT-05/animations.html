<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations</title>

    <link rel="stylesheet" href="animations.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <h1>Product Animations</h1>
    </header>

    <!-- LOADING SPINNER -->
    <section class="spinner-section">
        <div class="spinner"></div>
    </section>

    <!-- PRODUCT GRID -->
    <section class="product-grid">

        <!-- CARD 1 -->
        <div class="card fade-in">

            <!-- IMAGE -->
            <div class="image-container">
                <img src="https://picsum.photos/400/250?1" alt="">
            </div>

            <!-- CONTENT -->
            <div class="card-content">
                <h2>Gaming Laptop</h2>
                <p>High performance laptop for gaming.</p>

                <button>Buy Now</button>
            </div>

        </div>

        <!-- CARD 2 -->
        <div class="card fade-in">

            <div class="image-container">
                <img src="https://picsum.photos/400/250?2" alt="">
            </div>

            <div class="card-content">
                <h2>Wireless Headphones</h2>
                <p>Noise cancelling premium headphones.</p>

                <button>Buy Now</button>
            </div>

        </div>

        <!-- CARD 3 -->
        <div class="card fade-in">

            <div class="image-container">
                <img src="https://picsum.photos/400/250?3" alt="">
            </div>

            <div class="card-content">
                <h2>Smart Watch</h2>
                <p>Modern smartwatch with health tracking.</p>

                <button>Buy Now</button>
            </div>

        </div>

        <!-- CARD 4 -->
        <div class="card fade-in">

            <div class="image-container">
                <img src="https://picsum.photos/400/250?4" alt="">
            </div>

            <div class="card-content">
                <h2>Mechanical Keyboard</h2>
                <p>RGB keyboard for gamers and developers.</p>

                <button>Buy Now</button>
            </div>

        </div>

    </section>

</body>
</html>
