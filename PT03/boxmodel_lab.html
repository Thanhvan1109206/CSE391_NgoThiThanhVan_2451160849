<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Box Model Lab</title>

    <link rel="stylesheet" href="boxmodel.css">
</head>

<body>

    <h1>Phần 1 — Content-box vs Border-box</h1>

    <div class="wrap">

        <div class="box content-box">
            Content-box<br>
            width: 300px<br>
            padding: 20px<br>
            border: 5px
        </div>

        <div class="box border-box">
            Border-box<br>
            width: 300px<br>
            padding: 20px<br>
            border: 5px
        </div>

    </div>

    <h1>Phần 2 — Layout 3 cột</h1>

    <div class="layout">

        <div class="left">Sidebar</div>
        <div class="center">Content</div>
        <div class="right">Ads</div>

    </div>

</body>
</html>
