<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>📝 Todo App</h1>

        <!-- FORM -->

        <form id="todoForm">

            <input
                type="text"
                id="todoInput"
                placeholder="Nhập công việc..."
            >

            <button type="submit">
                Add
            </button>

        </form>


        <!-- FILTER -->

        <div class="filters">

            <button data-filter="all" class="active">
                All
            </button>

            <button data-filter="active">
                Active
            </button>

            <button data-filter="completed">
                Completed
            </button>

        </div>


        <!-- TODO LIST -->

        <ul id="todoList"></ul>


        <!-- FOOTER -->

        <div class="footer">

            <span id="count">
                0 items left
            </span>

            <button id="clearCompleted">
                Clear Completed
            </button>

        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
